name: Build Host

on:
  push:
    branches:
      - master
    paths:
      - "OrbitNX/**"
      - "VERSION"
      - ".github/workflows/build-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet build (Release)
        shell: pwsh
        run: |
          dotnet build OrbitNX/OrbitNX.csproj -c Release /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: OrbitNX-host-${{ github.sha }}
          path: OrbitNX/bin/Release/net10.0-windows10.0.18362.0/
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer (exe)
        shell: pwsh
        run: |
          & "${{ github.workspace }}\OrbitNX\scripts\build-installer.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OrbitNX-installer-${{ github.sha }}
          path: OrbitNX/Setup/OrbitNX-Setup.exe
          if-no-files-found: error

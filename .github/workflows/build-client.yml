name: Build Switch Client

on:
  push:
    paths:
      - "OrbitNX Client/**"
      - ".github/workflows/build-client.yml"
  pull_request:
    paths:
      - "OrbitNX Client/**"
      - ".github/workflows/build-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: devkitPro build (make)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ github.workspace }}\OrbitNX Client\OrbitNX\scripts\build.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: OrbitNX-switch-${{ github.sha }}
          path: "OrbitNX Client/OrbitNX/OrbitNX.nro"
          if-no-files-found: error

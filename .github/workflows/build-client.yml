name: Build Switch Client

on:
  push:
    branches:
      - master
    paths:
      - "Client/**"
      - "VERSION"
      - ".github/workflows/build-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # devkitPro's own image: devkitA64 + libnx + the switch portlibs the Makefile links.
    container: devkitpro/devkita64:20260219
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make
        run: make -C Client

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: OrbitNX-switch-${{ github.sha }}
          path: Client/OrbitNX-Switch.nro
          if-no-files-found: error

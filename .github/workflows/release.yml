name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build host installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ github.workspace }}\OrbitNX\scripts\build-installer.ps1" -Version "${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Switch client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ github.workspace }}\OrbitNX Client\OrbitNX\scripts\build.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            OrbitNX/Setup/OrbitNX-Setup.exe
            OrbitNX Client/OrbitNX/OrbitNX.nro

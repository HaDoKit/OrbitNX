name: Release

# Two ways to publish a release, both end in the same GitHub Release:
#   - Actions -> Release -> "Run workflow" (on master): the version comes from VERSION and the
#     tag v<VERSION> is created by this workflow on the commit it ran on.
#   - pushing a v* tag by hand: the tag must match VERSION.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          # VERSION is read by the app, the Switch client and the installer - the release tag must
          # match it, otherwise the release would ship binaries reporting another version.
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag v$tag_version does not match VERSION ($version)"
              exit 1
            fi
          elif [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "::error::Tag v$version already exists - bump VERSION before releasing again"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  client:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make
        run: make -C Client

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: release-nro
          path: Client/OrbitNX-Switch.nro
          if-no-files-found: error

  release:
    needs: [version, client]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          # The "## [<version>]" section of a changelog, up to the next heading or link reference.
          function Get-Section([string]$path) {
            $lines = Get-Content $path -Encoding UTF8
            $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$version]") })
            if ($start -lt 0) { Write-Error "No '## [$version]' section in $path"; exit 1 }
            $section = @()
            for ($i = $start + 1; $i -lt $lines.Length; $i++) {
              if ($lines[$i].StartsWith("## ") -or $lines[$i] -match '^\[[^\]]+\]:') { break }
              $section += $lines[$i]
            }
            ($section -join "`n").Trim()
          }
          $ru = Get-Section "CHANGELOG.md"
          $en = Get-Section "CHANGELOG.en.md"
          Set-Content -Path "${{ runner.temp }}\release-notes.md" -Value "$en`n`n---`n`n$ru" -Encoding utf8NoBOM

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build host installer
        shell: pwsh
        run: |
          & "${{ github.workspace }}\OrbitNX\scripts\build-installer.ps1" -Version "${{ needs.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download Switch client
        uses: actions/download-artifact@v4
        with:
          name: release-nro
          path: Client

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # Only used when the tag doesn't exist yet (manual run): tag the commit this run built.
          target_commitish: ${{ github.sha }}
          name: OrbitNX ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          # 0.1.0-alpha, 1.0.0-beta.2 ... are marked as pre-releases on GitHub.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            OrbitNX/Setup/OrbitNX-Setup.exe
            Client/OrbitNX-Switch.nro
